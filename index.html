<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e meter</title>
  <link rel="stylesheet" type="text/css" href="index.css">
</head>

<body>

  <main>

    <section>

      <div id="meter">
        <div id="needle"></div>
      </div>

      <div class="controls">
        <label>
          Tone Arm (scroll)
          <br>
          <input id="ta" type="range" min="-5" max="5" step="0.01" value="0">
        </label>
        <label>
          Sensitivity (zoom)
          <br>
          <input id="sens" type="range" min="0.01" max="1" step="0.01" value="2">
        </label>
      </div>

    </section>

    <section>

      <div id="squeeze-wrap" style="margin: 14px auto;">
        <button id="squeeze-btn" class="squeeze-btn">◉ auto-squeeze</button>
        <span id="squeeze-status" style="color:#555; margin-left:8px;"></span>
      </div>

      <div>µS: <span id="us">—</span> &nbsp; baseline: <span id="baseline-readout">—</span></div>

      <div id="io-controls">
        <button id="ble-btn" class="squeeze-btn">disconnected</button>
        <button id="dex-btn" class="squeeze-btn">deactivated</button>
        <button id="log-btn" class="squeeze-btn">log off</button>
      </div>

      <div id="dex-state" class="state-idle"
        style="text-align:center; margin-top:6px; font-size:0.85em; letter-spacing:0.05em;">—</div>

      <canvas id="poly" width="320" height="80"
        style="display:block; width:320px; height:80px; margin:12px auto;"></canvas>

    </section>

    <!-- DEX call toast — disabled for now, handleDexCall() below leaves this
         commented out but keeps marking events on the polygram.
    <div id="dex-toast">
      <span id="toast-label">● <span id="toast-label-text">read</span></span>
      <span id="toast-conf">0.00</span>
      <button class="toast-btn yes" id="toast-yes">👍</button>
      <button class="toast-btn no" id="toast-no">👎</button>
      <button id="toast-dismiss">✕</button>
    </div>
    -->

  </main>

  <script>
    // ── UUIDs (match animated meter / ESP32 firmware) ──
    const BLE_SERVICE_UUID = "454d4554-0000-1000-8000-00805f9b34fb";
    const BLE_CHAR_UUID = "454d4554-4552-4c45-8d41-52454144494e";

    const needle = document.getElementById("needle");

    // ── dex.log ──────────────────────────────────────────────────────────
    // Flip this one line to silence logging entirely (console + file).
    const DEX_LOGGING = true;

    let logFileHandle = null;
    let logWritable = null;

    const logBtn = document.getElementById("log-btn");

    async function logToggle() {
      if (logWritable) {
        await logWritable.close();
        logWritable = null;
        logFileHandle = null;
        logBtn.textContent = "log off";
        logBtn.classList.remove("on");
        return;
      }
      try {
        logFileHandle = await window.showSaveFilePicker({
          suggestedName: "dex.log",
          types: [{ description: "Log file", accept: { "text/plain": [".log"] } }],
        });
        logWritable = await logFileHandle.createWritable({ keepExistingData: true });
        // append rather than overwrite: seek to end if the file already had content
        const existing = await (await logFileHandle.getFile()).size;
        if (existing) await logWritable.write({ type: "write", position: existing, data: "" });
        logBtn.textContent = logFileHandle.name;
        logBtn.classList.add("on");
        log("session", { msg: "log opened" });
      } catch (err) {
        // user cancelled the picker, or API unsupported -- console-only is still fine
        logBtn.textContent = "unavailable";
        logBtn.classList.add("error");
        setTimeout(() => { logBtn.textContent = "log off"; logBtn.classList.remove("error"); }, 1500);
      }
    }
    logBtn.addEventListener("click", logToggle);

    function log(type, data) {
      if (!DEX_LOGGING) return;
      const line = { ts: Date.now(), type, ...data };
      console.log(`[dex.log] ${type}`, line);
      if (logWritable) {
        logWritable.write(JSON.stringify(line) + "\n").catch(() => { });
      }
    }

    window.addEventListener("beforeunload", () => {
      if (logWritable) logWritable.close();
    });

    let toneArm = 0;
    let sensitivity = 2;

    document.getElementById("ta").oninput = e => { toneArm = parseFloat(e.target.value); };
    document.getElementById("sens").oninput = e => { sensitivity = parseFloat(e.target.value); };

    // ── helpers to sync sliders to programmatic changes ──
    function setToneArm(v) {
      toneArm = v;
      const el = document.getElementById("ta");
      el.value = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), v));
    }
    function setSensitivity(v) {
      sensitivity = v;
      const el = document.getElementById("sens");
      el.value = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), v));
    }

    // ── Auto-squeeze ──
    const squeezeBtn = document.getElementById("squeeze-btn");
    const squeezeStat = document.getElementById("squeeze-status");
    let squeezing = false;
    let sqMin = Infinity;
    let sqMax = -Infinity;

    function squeezeStart() {
      squeezing = true;
      sqMin = Infinity;
      sqMax = -Infinity;
      squeezeBtn.style.borderColor = "#cc4";
      squeezeBtn.style.color = "#cc4";
      squeezeBtn.textContent = "◉ hold…";
      squeezeStat.textContent = "";
    }

    function squeezeCommit() {
      squeezing = false;
      squeezeBtn.style.borderColor = "#555";
      squeezeBtn.style.color = "#888";
      squeezeBtn.textContent = "◉ auto-squeeze";

      if (sqMin === Infinity || sqMax === sqMin) {
        squeezeStat.textContent = "no signal";
        return;
      }

      // We want the squeeze range to drive the needle ~1/3 of full deflection.
      // Full deflection = drive of 1.0 (signal * sensitivity = 1).
      // Target: (sqMax - sqMin) * sensitivity = 1/3  →  sensitivity = 1/3 / range
      const range = sqMax - sqMin;
      const newSens = (1 / 3) / range;

      // Center the needle on the peak of the squeeze (highest conductance = most arousal).
      // At peak: signal = sqMax - baseline_at_that_moment ≈ sqMax - sqMin (rough).
      // drive = (sqMax - sqMin) * newSens = 1/3.
      // We want final = 0 (center), so: -drive + toneArm = 0 → toneArm = drive = 1/3.
      // But current baseline may already be tracking, so use current smooth as anchor.
      const newTA = (smooth !== null)
        ? (smooth - (sqMin + sqMax) / 2) * newSens   // offset to center midpoint
        : 0;

      setSensitivity(parseFloat(newSens.toFixed(3)));
      setToneArm(parseFloat(newTA.toFixed(3)));

      squeezeStat.textContent = `sens=${newSens.toFixed(2)} ta=${newTA.toFixed(2)}`;
    }

    // Hold-to-squeeze: mousedown/touchstart → mouseup/touchend
    squeezeBtn.addEventListener("mousedown", squeezeStart);
    squeezeBtn.addEventListener("touchstart", e => { e.preventDefault(); squeezeStart(); }, { passive: false });
    window.addEventListener("mouseup", () => { if (squeezing) squeezeCommit(); });
    window.addEventListener("touchend", () => { if (squeezing) squeezeCommit(); });

    // Needle state: a dt-aware EMA (not a fixed per-notification constant),
    // so drift rate is defined in real seconds regardless of BLE notification
    // jitter -- and it's explicitly reset on every fresh connect, so no
    // session's drift history leaks into the next.
    let baseline = null;
    let smooth = null;
    let lastFrameT = null;
    let lastUS = null;
    const SMOOTH_TAU_S = 0.15;   // fast tracker: needle responsiveness
    const BASELINE_TAU_S = 20;   // slow tonic tracker: "where is home"

    let taLog = [];              // { t, baseline } -- tone-arm-action samples
    let lastTaLogT = 0;
    const TA_LOG_INTERVAL_MS = 1000;

    function resetNeedleState() {
      baseline = null;
      smooth = null;
      lastFrameT = null;
      lastUS = null;
      taLog = [];
      lastTaLogT = 0;
    }

    // ── DEX detector — ported straight from serve.py's SessionState. ──
    // Deliberately shares `baseline` above rather than keeping its own copy:
    // that's the whole point of this migration. When dex is active it OWNS
    // baseline updates (freezing baseline during a fall, same as the server
    // did -- the needle simply stops re-nulling mid-event, which is what
    // you'd want anyway). When dex is inactive, the plain EMA above runs
    // instead. Either way there is exactly one baseline value in existence.
    // ACCUM_THRESH_K is just a placeholder.
    const CALIBRATION_FRAMES = 100;   // ~5s at 20Hz
    const NOISE_TAU_S = 5.0;
    const NOISE_FLOOR_MIN = 1e-4;
    const ARM_THRESH_K = 4.0;         // adjust fall sensitivity here
    const ACCUM_TAU_S = 1.5;          // memory horizon: how long a decline "counts" before decaying away
    const ACCUM_THRESH_K = 6.0;       // separate scale from ARM_THRESH_K — retune against real data
    const SETTLE_THRESH_K = 2.0;
    const SETTLE_FRAMES = 6;
    const FALLING_TIMEOUT_S = 20.0;
    const SUSTAIN_TOL_FRAC = 0.30;
    const SUSTAIN_TOL_K = 3.0;

    let dexActive = false;
    let dexState = "IDLE";
    let noiseScale = null;
    let calibCount = 0;
    let debounceCount = 0;
    let declineAccum = 0;             // decaying sum of recent decline (µS-ish, not a rate)
    let settleCount = 0;
    let prevSign = 0;
    let runLen = 0;
    let preBaseline = null;
    let tStart = null;
    let peakUS = null;
    let peakT = null;

    function dexReset() {
      // resets detector calibration only -- baseline/smooth (the needle's
      // own trackers) are untouched, so toggling dex on/off never perturbs
      // what the needle is showing.
      dexState = "IDLE";
      noiseScale = null;
      calibCount = 0;
      debounceCount = 0;
      declineAccum = 0;
      settleCount = 0;
      prevSign = 0;
      runLen = 0;
      preBaseline = null;
      tStart = null;
      peakUS = null;
      peakT = null;
      setDexStateDisplay(dexState);
    }

    function dexTick(uS, delta, dt, tMs) {
      if (dexState === "IDLE") { dexTickIdle(uS, delta, dt); return null; }
      if (dexState === "ARMED") { return dexTickArmed(uS, delta, dt, tMs); }
      return dexTickFalling(uS, delta, dt, tMs);
    }

    function dexTickIdle(uS, delta, dt) {
      if (noiseScale === null) {
        noiseScale = Math.max(Math.abs(delta), NOISE_FLOOR_MIN);
      } else {
        baseline += (uS - baseline) * Math.min(dt / BASELINE_TAU_S, 1);
        noiseScale += (Math.abs(delta) - noiseScale) * Math.min(dt / NOISE_TAU_S, 1);
        noiseScale = Math.max(noiseScale, NOISE_FLOOR_MIN);
      }
      calibCount++;
      if (calibCount >= CALIBRATION_FRAMES) {
        dexState = "ARMED";
        setDexStateDisplay(dexState);
        log("transition", { from: "IDLE", to: "ARMED", baseline, noiseScale });
      }
    }

    function dexTickArmed(uS, delta, dt, tMs) {
      // decaying accumulator: a slow, gradual fall builds this up over several
      // seconds even though no single frame's delta clears an instantaneous
      // threshold. Jitter decays away between frames instead of accumulating,
      // since `decay` pulls it back toward zero every tick regardless of sign.
      const decay = Math.exp(-dt / ACCUM_TAU_S);
      declineAccum = declineAccum * decay + Math.max(0, -delta);

      const accumThresh = ACCUM_THRESH_K * noiseScale;
      const overThresh = declineAccum > accumThresh;

      if (!overThresh) {
        baseline += (uS - baseline) * Math.min(dt / BASELINE_TAU_S, 1);

        // only feed the noise estimator genuine back-and-forth jitter, not
        // a sustained run in one direction (see serve.py for why -- a slow
        // real fall's early frames otherwise inflate the very threshold
        // meant to catch it).
        const sign = (delta > 0 ? 1 : 0) - (delta < 0 ? 1 : 0);
        if (sign !== 0 && sign === prevSign) { runLen++; } else { runLen = 1; prevSign = sign; }
        if (runLen <= 2) {
          noiseScale += (Math.abs(delta) - noiseScale) * Math.min(dt / NOISE_TAU_S, 1);
          noiseScale = Math.max(noiseScale, NOISE_FLOOR_MIN);
        }
      }

      if (overThresh) {
        preBaseline = baseline;
        tStart = tMs / 1000;
        peakUS = uS;
        peakT = 0;
        settleCount = 0;
        declineAccum = 0;
        dexState = "FALLING";
        setDexStateDisplay(dexState);
        log("transition", { from: "ARMED", to: "FALLING", baseline, noiseScale, accumThresh });
      }
      return null;
    }

    function dexTickFalling(uS, delta, dt, tMs) {
      const tRel = tMs / 1000 - tStart;
      if (uS < peakUS) { peakUS = uS; peakT = tRel; }

      const settleThresh = SETTLE_THRESH_K * noiseScale;
      settleCount = Math.abs(delta) < settleThresh ? settleCount + 1 : 0;

      const timedOut = tRel >= FALLING_TIMEOUT_S;
      if (settleCount >= SETTLE_FRAMES || timedOut) {
        return dexResolve(uS, tRel);
      }
      return null;
    }

    function dexResolve(sustainUS, tRel) {
      const amplitude = preBaseline - peakUS;
      const attackS = peakT;
      const releaseS = tRel - peakT;

      const tol = Math.max(SUSTAIN_TOL_K * noiseScale, SUSTAIN_TOL_FRAC * Math.abs(amplitude));
      const offset = Math.abs(sustainUS - preBaseline);
      const isRead = offset <= tol;

      const margin = tol > 0 ? (tol - offset) / tol : 0;
      const confidence = isRead
        ? Math.min(Math.max(0.5 + 0.5 * margin, 0.5), 0.99)
        : Math.min(Math.max(0.5 + 0.5 * -margin, 0.5), 0.99);

      const features = {
        amplitude: +amplitude.toFixed(4),
        attack_s: +attackS.toFixed(3),
        release_s: +releaseS.toFixed(3),
        baseline_uS: +preBaseline.toFixed(4),
        sustain_uS: +sustainUS.toFixed(4),
      };

      baseline = sustainUS;   // re-center, real or artifact, wherever it landed
      dexState = "ARMED";
      preBaseline = null;
      setDexStateDisplay(dexState);
      log("call", { label: isRead ? "read" : "other", confidence: +confidence.toFixed(3), features });

      return { label: isRead ? "read" : "other", confidence: +confidence.toFixed(3), features };
    }

    function updateNeedle(uS, tMs) {
      const now = tMs ?? Date.now();
      const dt = lastFrameT === null ? 0.05 : Math.max((now - lastFrameT) / 1000, 0.001);
      const delta = lastUS === null ? 0 : uS - lastUS;
      if (lastFrameT !== null && (dt > 0.15 || dt < 0.01)) {
        log("dt_anomaly", { dt: +dt.toFixed(4), delta: +delta.toFixed(4) });
      }
      lastFrameT = now;
      lastUS = uS;

      if (smooth === null) smooth = uS;
      if (baseline === null) baseline = uS;

      smooth += (uS - smooth) * Math.min(dt / SMOOTH_TAU_S, 1);

      let dexResult = null;
      if (dexActive) {
        dexResult = dexTick(uS, delta, dt, now);   // owns baseline while active
      } else {
        baseline += (uS - baseline) * Math.min(dt / BASELINE_TAU_S, 1);
      }

      let signal = smooth - baseline;
      let drive = signal * sensitivity;
      let final = Math.max(-1, Math.min(1, -drive + toneArm));
      let angle = -90 + (final + 1) * 90;

      needle.style.transform = `rotate(${angle}deg)`;

      const baselineEl = document.getElementById("baseline-readout");
      if (baselineEl) baselineEl.textContent = baseline.toFixed(3);

      if (now - lastTaLogT >= TA_LOG_INTERVAL_MS) {
        taLog.push({ t: now, baseline });
        lastTaLogT = now;
      }

      if (dexResult) handleDexCall(dexResult);
    }

    // ── Polygram (canvas) ──
    const polyCanvas = document.getElementById("poly");
    const ctx = polyCanvas.getContext("2d");
    const W = 320, H = 80;

    let polyData = [];
    let polyMin = Infinity;
    let polyMax = -Infinity;
    let polyTicks = [];        // { t, label } — DEX event markers
    const WINDOW_MS = 30000;

    function updatePolygram(uS) {
      const now = Date.now();
      const cutoff = now - WINDOW_MS;

      polyData.push({ t: now, uS });

      let pruneCount = 0;
      while (pruneCount < polyData.length && polyData[pruneCount].t < cutoff) pruneCount++;
      if (pruneCount > 0) polyData.splice(0, pruneCount);

      if (pruneCount > 0) {
        polyMin = Infinity; polyMax = -Infinity;
        for (const p of polyData) {
          if (p.uS < polyMin) polyMin = p.uS;
          if (p.uS > polyMax) polyMax = p.uS;
        }
      } else {
        if (uS < polyMin) polyMin = uS;
        if (uS > polyMax) polyMax = uS;
      }

      // prune old ticks
      polyTicks = polyTicks.filter(tk => tk.t >= cutoff);
    }

    function renderPolygram() {
      requestAnimationFrame(renderPolygram);
      ctx.clearRect(0, 0, W, H);
      if (polyData.length < 2) return;

      const now = Date.now();
      const pad = Math.max((polyMax - polyMin) * 0.2, 2);
      const lo = polyMin - pad;
      const range = (polyMax + pad - lo) || 1;

      const toY = v => H * (1 - (v - lo) / range);
      const toX = t => W * (1 - (now - t) / WINDOW_MS);

      // DEX event ticks
      for (const tk of polyTicks) {
        const x = toX(tk.t);
        if (x < 0 || x > W) continue;
        ctx.beginPath();
        ctx.strokeStyle = tk.label === "read" ? "rgba(255,80,80,0.5)" : "rgba(120,120,120,0.4)";
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 3]);
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
        ctx.setLineDash([]);

        // tiny label
        ctx.fillStyle = tk.label === "read" ? "rgba(255,80,80,0.7)" : "rgba(160,160,160,0.6)";
        ctx.font = "8px monospace";
        ctx.fillText(tk.label === "read" ? "R" : "·", x + 2, 10);
      }

      // signal path
      ctx.beginPath();
      ctx.strokeStyle = "red";
      ctx.lineWidth = 1.5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      for (let i = 0; i < polyData.length; i++) {
        const x = toX(polyData[i].t);
        const y = toY(polyData[i].uS);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    renderPolygram();

    function handleFrame(f) {
      const uS = f.smooth_uS ?? f.uS;
      if (uS == null) return;
      updateNeedle(uS, f.t);
      updatePolygram(uS);
      document.getElementById("us").textContent = uS.toFixed(2);

      // collect for auto-squeeze
      if (squeezing) {
        if (uS < sqMin) sqMin = uS;
        if (uS > sqMax) sqMax = uS;
      }
    }

    // ── BLE ──
    const bleBtn = document.getElementById("ble-btn");
    let bleDevice = null;
    let bleChar = null;
    let intentionalDisconnect = false;

    let boundDisconnectHandler = null;
    let boundCharHandler = null;

    function setBleStatus(text, cls) {
      bleBtn.textContent = text;
      bleBtn.classList.remove("on", "scanning", "error");
      if (cls) bleBtn.classList.add(cls);
    }

    function charHandler(e) {
      try { handleFrame(JSON.parse(new TextDecoder().decode(e.target.value))); } catch (_) { }
    }

    function bleCleanup() {
      if (bleChar && boundCharHandler) {
        bleChar.removeEventListener("characteristicvaluechanged", boundCharHandler);
      }
      if (bleDevice && boundDisconnectHandler) {
        bleDevice.removeEventListener("gattserverdisconnected", boundDisconnectHandler);
      }
      bleChar = null;
      boundCharHandler = null;
      boundDisconnectHandler = null;
    }

    async function attachNotifications(server) {
      const service = await server.getPrimaryService(BLE_SERVICE_UUID);
      bleChar = await service.getCharacteristic(BLE_CHAR_UUID);
      await bleChar.startNotifications();
      boundCharHandler = charHandler;
      bleChar.addEventListener("characteristicvaluechanged", boundCharHandler);
    }

    async function handleDisconnect() {
      bleChar = null;
      if (intentionalDisconnect) {
        bleCleanup();
        setBleStatus("disconnected", "");
        bleBtn.disabled = false;
        return;
      }

      for (let i = 1; i <= 3; i++) {
        setBleStatus(`reconnecting (${i}/3)…`, "scanning");
        bleBtn.disabled = true;
        await new Promise(r => setTimeout(r, 1000));
        try {
          const server = await bleDevice.gatt.connect();
          await attachNotifications(server);
          resetNeedleState();
          setBleStatus("connected", "on");
          bleBtn.disabled = false;
          return;
        } catch (_) { }
      }

      bleCleanup();
      setBleStatus("disconnected", "");
      bleBtn.disabled = false;
    }

    async function bleConnect() {
      if (!navigator.bluetooth) {
        setBleStatus("no web bluetooth", "error");
        return;
      }

      if (bleDevice && bleDevice.gatt.connected) {
        intentionalDisconnect = true;
        bleDevice.gatt.disconnect();
        return;
      }

      bleBtn.disabled = true;
      setBleStatus("scanning…", "scanning");

      try {
        bleCleanup();
        bleDevice = null;

        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ services: [BLE_SERVICE_UUID] }]
        });

        intentionalDisconnect = false;
        boundDisconnectHandler = handleDisconnect;
        bleDevice.addEventListener("gattserverdisconnected", boundDisconnectHandler);

        setBleStatus("connecting…", "scanning");
        const server = await bleDevice.gatt.connect();
        await attachNotifications(server);

        resetNeedleState();

        setBleStatus("connected", "on");
        bleBtn.disabled = false;

      } catch (err) {
        bleCleanup();
        bleDevice = null;
        setBleStatus(err.name === "NotFoundError" ? "cancelled" : err.message, "error");
        bleBtn.disabled = false;
      }
    }

    bleBtn.addEventListener("click", bleConnect);

    // ── DEX toggle (local now — no server, no socket) ──
    const dexBtn = document.getElementById("dex-btn");

    function setDexStatus(text, cls) {
      dexBtn.textContent = text;
      dexBtn.classList.remove("on", "scanning", "error");
      if (cls) dexBtn.classList.add(cls);
    }

    const dexStateEl = document.getElementById("dex-state");
    function setDexStateDisplay(state) {
      dexStateEl.textContent = state; // "IDLE" | "ARMED" | "FALLING"
      dexStateEl.className = "state-" + state.toLowerCase();
    }

    let heartbeatTimer = null;
    const HEARTBEAT_MS = 3000;

    function dexToggle() {
      dexActive = !dexActive;
      if (dexActive) {
        dexReset();   // fresh calibration; baseline/smooth untouched
        setDexStatus("activated", "on");
        log("session", { msg: "dex activated" });
        clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(() => {
          if (dexState === "ARMED") {
            log("heartbeat", { state: dexState, baseline, noiseScale });
          }
        }, HEARTBEAT_MS);
      } else {
        setDexStatus("deactivated", "");
        dexStateEl.textContent = "—";
        dexStateEl.className = "state-idle";
        log("session", { msg: "dex deactivated" });
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
    }

    dexBtn.addEventListener("click", dexToggle);

    // ── DEX call handling (toast disabled for now — DOM above is
    //    commented out; still marks calls on the polygram and logs) ──
    function handleDexCall(result) {
      polyTicks.push({ t: Date.now(), label: result.label });
      // console output for this call is already handled by log("call", ...) in dexResolve
    }
  </script>

</body>

</html>
